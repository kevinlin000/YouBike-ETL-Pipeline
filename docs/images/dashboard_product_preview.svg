<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">YouBike 調度風險工作台預覽</title>
  <desc id="desc">Streamlit dashboard 固定範例資料模式的產品化預覽，包含條件設定、營運摘要、單站預測與多站風險排序。</desc>
  <style>
    .bg { fill: #ffffff; }
    .sidebar { fill: #f6f8fb; stroke: #dbe3ed; }
    .panel { fill: #ffffff; stroke: #dbe3ed; }
    .soft { fill: #f8fafc; }
    .soft-blue { fill: #eef6ff; stroke: #bfdbfe; }
    .ink { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .teal { fill: #0f766e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .white { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font-size: 17px; }
    .xs { font-size: 15px; }
    .label { font-size: 16px; font-weight: 600; }
    .value { font-size: 22px; font-weight: 700; }
    .h1 { font-size: 44px; font-weight: 800; }
    .h2 { font-size: 30px; font-weight: 800; }
    .h3 { font-size: 22px; font-weight: 750; }
    .card-title { font-size: 20px; font-weight: 760; }
    .pill { fill: #f1f5f9; }
    .button { fill: #0f766e; }
    .line { stroke: #dbe3ed; stroke-width: 1; }
    .red { fill: #b91c1c; }
    .amber { fill: #b45309; }
    .blue { fill: #2563eb; }
    .green { fill: #15803d; }
  </style>

  <rect class="bg" x="0" y="0" width="1440" height="1020"/>

  <rect class="sidebar" x="0" y="0" width="300" height="1020"/>
  <text class="ink h3" x="28" y="92">條件設定</text>
  <rect x="28" y="125" width="19" height="19" rx="4" fill="#0f766e"/>
  <path d="M33 134l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ink label" x="58" y="141">使用固定範例資料</text>
  <rect class="soft-blue" x="28" y="174" width="244" height="92" rx="8"/>
  <text class="ink label" x="46" y="207">本機檢視模式</text>
  <text class="muted small" x="46" y="237">固定站點與模擬推論結果</text>

  <text class="ink label" x="28" y="318">單站檢視站點</text>
  <rect class="panel" x="28" y="338" width="244" height="48" rx="8"/>
  <text class="ink small" x="46" y="368">捷運公館站 [500101001]</text>
  <path d="M246 357l7 7 7-7" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <text class="ink label" x="28" y="438">氣溫 (°C)</text>
  <line x1="28" y1="472" x2="272" y2="472" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="472" x2="150" y2="472" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="472" r="8" fill="#0f766e"/>
  <text class="teal label" x="132" y="458">25.0</text>

  <text class="ink label" x="28" y="545">降雨量 (mm)</text>
  <line x1="28" y1="579" x2="272" y2="579" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/>
  <circle cx="28" cy="579" r="8" fill="#0f766e"/>
  <text class="teal label" x="28" y="565">0.0</text>

  <rect class="panel" x="28" y="642" width="244" height="68" rx="8"/>
  <text class="muted xs" x="46" y="668">天氣狀態</text>
  <text class="ink value" x="46" y="696">無雨</text>

  <g transform="translate(380 72)">
    <text class="teal label" x="0" y="0">站點供需監控</text>
    <text class="ink h1" x="0" y="58">YouBike 調度風險工作台</text>
    <text class="muted small" x="0" y="100">整合模型時窗預測與規則化風險分數，檢視單站水位、多站缺車風險與滿站風險。</text>
    <rect class="panel" x="800" y="-20" width="220" height="76" rx="8"/>
    <text class="muted xs" x="822" y="9">資料來源</text>
    <text class="ink h3" x="822" y="40">固定範例資料</text>
  </g>

  <line class="line" x1="380" y1="192" x2="1360" y2="192"/>

  <g transform="translate(380 220)">
    <rect class="panel" x="0" y="0" width="230" height="88" rx="8"/>
    <text class="muted xs" x="18" y="28">服務狀態</text>
    <text class="ink h3" x="18" y="58">固定範例資料</text>
    <text class="muted xs" x="18" y="80">不依賴後端服務</text>

    <rect class="panel" x="250" y="0" width="230" height="88" rx="8"/>
    <text class="muted xs" x="268" y="28">支援站點</text>
    <text class="ink h3" x="268" y="58">6 站</text>
    <text class="muted xs" x="268" y="80">目前可供檢視</text>

    <rect class="panel" x="500" y="0" width="230" height="88" rx="8"/>
    <text class="muted xs" x="518" y="28">單站焦點</text>
    <text class="ink h3" x="518" y="58">捷運公館站</text>
    <text class="muted xs" x="518" y="80">大安區</text>

    <rect class="panel" x="750" y="0" width="230" height="88" rx="8"/>
    <text class="muted xs" x="768" y="28">天氣條件</text>
    <text class="ink h3" x="768" y="58">25.0°C / 無雨</text>
    <text class="muted xs" x="768" y="80">降雨量 0.0 mm</text>
  </g>

  <g transform="translate(380 342)">
    <text class="teal label" x="0" y="0">單站預測</text>
    <text class="ink label" x="96" y="0">多站風險排序</text>
    <line x1="0" y1="15" x2="980" y2="15" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="0" y1="15" x2="73" y2="15" stroke="#0f766e" stroke-width="3"/>
  </g>

  <g transform="translate(380 402)">
    <text class="ink h2" x="0" y="0">單站水位預測</text>
    <text class="muted small" x="0" y="36">依目前車輛數與天氣條件，檢查指定站點在模型時窗內的供需狀態。</text>
    <rect class="panel" x="0" y="70" width="470" height="230" rx="8"/>
    <text class="ink h3" x="22" y="107">目前站點狀態</text>
    <text class="muted small" x="22" y="139">目前可借車輛</text>
    <line x1="22" y1="174" x2="420" y2="174" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="174" x2="150" y2="174" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="174" r="8" fill="#0f766e"/>
    <text class="ink value" x="22" y="218">捷運公館站 (大安區)</text>
    <text class="muted small" x="22" y="250">站點編號：500101001 · 目前可借車輛 15 台</text>

    <rect class="panel" x="510" y="70" width="470" height="230" rx="8"/>
    <rect class="green" x="510" y="70" width="5" height="230" rx="2"/>
    <text class="ink h3" x="536" y="107">預測結果</text>
    <text class="muted small" x="536" y="139">供需穩定</text>
    <text class="ink h1" x="536" y="195">13 台</text>
    <text class="muted small" x="536" y="232">預測剩餘 13 台，供需暫時穩定。</text>
    <text class="ink label" x="536" y="268">相對目前 -2 台 · 維持監控</text>
  </g>

  <g transform="translate(380 745)">
    <text class="ink h2" x="0" y="0">多站風險排序</text>
    <rect class="panel" x="0" y="34" width="230" height="74" rx="8"/>
    <text class="muted xs" x="18" y="62">高優先處理</text>
    <text class="ink value" x="18" y="92">4 站</text>
    <rect class="panel" x="250" y="34" width="230" height="74" rx="8"/>
    <text class="muted xs" x="268" y="62">觀察名單</text>
    <text class="ink value" x="268" y="92">0 站</text>
    <rect class="panel" x="500" y="34" width="230" height="74" rx="8"/>
    <text class="muted xs" x="518" y="62">供需穩定</text>
    <text class="ink value" x="518" y="92">1 站</text>
    <rect class="panel" x="750" y="34" width="230" height="74" rx="8"/>
    <text class="muted xs" x="768" y="62">首要動作</text>
    <text class="ink value" x="768" y="92">建議補車</text>
  </g>

  <g transform="translate(380 875)">
    <rect class="panel" x="0" y="0" width="300" height="120" rx="8"/>
    <rect class="red" x="0" y="0" width="5" height="120" rx="2"/>
    <text class="muted xs" x="22" y="30">調度順位 1</text>
    <text class="ink card-title" x="22" y="62">臺大資訊大樓</text>
    <rect class="pill" x="22" y="78" width="126" height="28" rx="14"/>
    <text class="ink xs" x="38" y="97">嚴重缺車 · 101 分</text>

    <rect class="panel" x="340" y="0" width="300" height="120" rx="8"/>
    <rect class="red" x="340" y="0" width="5" height="120" rx="2"/>
    <text class="muted xs" x="362" y="30">調度順位 2</text>
    <text class="ink card-title" x="362" y="62">捷運公館站</text>
    <rect class="pill" x="362" y="78" width="126" height="28" rx="14"/>
    <text class="ink xs" x="378" y="97">嚴重缺車 · 100 分</text>

    <rect class="panel" x="680" y="0" width="300" height="120" rx="8"/>
    <rect class="amber" x="680" y="0" width="5" height="120" rx="2"/>
    <text class="muted xs" x="702" y="30">調度順位 3</text>
    <text class="ink card-title" x="702" y="62">捷運市政府站</text>
    <rect class="pill" x="702" y="78" width="120" height="28" rx="14"/>
    <text class="ink xs" x="718" y="97">滿站風險 · 92 分</text>
  </g>
</svg>
