<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">後端與模型服務架構</title>
  <desc id="desc">以 FastAPI 模型服務 API、Streamlit dashboard、模型 artifact，以及 Airflow 與 MySQL 資料管線為核心的架構圖。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .api { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .client { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .model { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .data { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .test { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .label { fill: #0f172a; font: 700 24px Arial, sans-serif; }
      .h2 { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .body { fill: #334155; font: 14px Arial, sans-serif; }
      .small { fill: #475569; font: 12px Arial, sans-serif; }
      .arrow { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowhead); }
      .divider { stroke: #cbd5e1; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#475569" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="680" />

  <text class="label" x="48" y="50">後端與模型服務架構</text>
  <text class="body" x="48" y="76">FastAPI 負責模型服務 contract；Streamlit 呈現資料應用流程；Airflow 與 MySQL 提供資料基礎。</text>

  <rect class="panel" x="40" y="105" width="300" height="455" rx="8" />
  <text class="h2" x="64" y="138">資料基礎</text>
  <line class="divider" x1="64" y1="152" x2="316" y2="152" />

  <rect class="data" x="68" y="178" width="244" height="74" rx="8" />
  <text class="h2" x="88" y="207">YouBike / 天氣 API</text>
  <text class="small" x="88" y="229">站點狀態與天氣訊號</text>

  <rect class="data" x="68" y="286" width="244" height="82" rx="8" />
  <text class="h2" x="88" y="316">Airflow ETL</text>
  <text class="small" x="88" y="338">定期擷取</text>
  <text class="small" x="88" y="356">資料驗證</text>

  <rect class="data" x="68" y="402" width="244" height="92" rx="8" />
  <text class="h2" x="88" y="432">MySQL Warehouse</text>
  <text class="small" x="88" y="454">station_info 維度表</text>
  <text class="small" x="88" y="472">station_status 事實表</text>

  <rect class="panel" x="390" y="105" width="390" height="455" rx="8" />
  <text class="h2" x="414" y="138">FastAPI 後端核心</text>
  <line class="divider" x1="414" y1="152" x2="756" y2="152" />

  <rect class="api" x="424" y="178" width="322" height="98" rx="8" />
  <text class="h2" x="448" y="208">模型服務 API</text>
  <text class="small" x="448" y="232">GET /stations</text>
  <text class="small" x="448" y="250">POST /predict</text>
  <text class="small" x="448" y="268">POST /stations/risk</text>

  <rect class="api" x="424" y="306" width="322" height="102" rx="8" />
  <text class="h2" x="448" y="336">Contract 與 Runtime 邊界</text>
  <text class="small" x="448" y="360">Pydantic 驗證</text>
  <text class="small" x="448" y="378">503 模型狀態、404 站點支援範圍</text>
  <text class="small" x="448" y="396">forecast_horizon metadata</text>

  <rect class="api" x="424" y="438" width="322" height="82" rx="8" />
  <text class="h2" x="448" y="468">風險轉換</text>
  <text class="small" x="448" y="492">stock_out / full_load / low_supply</text>
  <text class="small" x="448" y="510">排序後的調度建議</text>

  <rect class="panel" x="830" y="105" width="310" height="455" rx="8" />
  <text class="h2" x="854" y="138">模型與介面層</text>
  <line class="divider" x1="854" y1="152" x2="1116" y2="152" />

  <rect class="model" x="858" y="178" width="250" height="98" rx="8" />
  <text class="h2" x="878" y="208">模型 Artifact</text>
  <text class="small" x="878" y="232">PyTorch LSTM 權重</text>
  <text class="small" x="878" y="250">scaler 與 station mapping</text>
  <text class="small" x="878" y="268">metadata 與 baseline 評估</text>

  <rect class="client" x="858" y="316" width="250" height="92" rx="8" />
  <text class="h2" x="878" y="346">Streamlit Dashboard</text>
  <text class="small" x="878" y="370">單站預測</text>
  <text class="small" x="878" y="388">多站風險排序</text>

  <rect class="test" x="858" y="438" width="250" height="82" rx="8" />
  <text class="h2" x="878" y="468">Demo 與 CI</text>
  <text class="small" x="878" y="492">固定範例 demo mode</text>
  <text class="small" x="878" y="510">API、dashboard、ETL、dbt tests</text>

  <path class="arrow" d="M190 252 L190 286" />
  <path class="arrow" d="M190 368 L190 402" />
  <path class="arrow" d="M312 448 C360 448 360 227 424 227" />
  <path class="arrow" d="M746 227 C802 227 802 227 858 227" />
  <path class="arrow" d="M858 362 C802 362 802 356 746 356" />
  <path class="arrow" d="M746 478 C802 478 802 362 858 362" />
  <path class="dash" d="M983 276 L983 316" />
  <path class="dash" d="M983 408 L983 438" />

  <text class="small" x="360" y="612">重點：API contract、推論邊界、風險排序流程，以及可檢視的資料應用介面。</text>
</svg>
